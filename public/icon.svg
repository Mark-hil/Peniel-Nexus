<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#14532d" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Subtle top highlight -->
  <path d="M140 48 H372 C430 48 464 82 464 140 C440 180 380 200 256 200 C132 200 72 180 48 140 C48 82 82 48 140 48 Z" fill="#ffffff" opacity="0.08" />

  <!-- Shopping Basket Graphics -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Basket Handles -->
    <path d="M176 210 L256 120 L336 210" />
    <path d="M256 120 V210" stroke-dasharray="1 1" opacity="0.4" />
    
    <!-- Basket Rim -->
    <path d="M110 220 H402" stroke-width="28" />
    
    <!-- Basket Body -->
    <path d="M136 230 L166 384 C170 404 186 418 206 418 H306 C326 418 342 404 346 384 L376 230" fill="#ffffff" fill-opacity="0.12" stroke-width="26" />
    
    <!-- Weave details -->
    <path d="M200 230 L220 418" stroke-width="18" opacity="0.6" />
    <path d="M312 230 L292 418" stroke-width="18" opacity="0.6" />
    <path d="M148 310 H364" stroke-width="18" opacity="0.6" />
  </g>

  <!-- Fresh Orange/Tomato Pip Highlight -->
  <circle cx="340" cy="180" r="28" fill="#f97316" stroke="#ffffff" stroke-width="8" />
  <!-- Small Leaf -->
  <path d="M340 156 C344 142 360 140 366 142 C366 154 354 160 340 156 Z" fill="#84cc16" />
</svg>
